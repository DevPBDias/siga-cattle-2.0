<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="fazendaBBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#1162AE"/>
    </linearGradient>
    <linearGradient id="fazendaBGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFCB04"/>
    </linearGradient>
  </defs>

  <!-- Circular Shield Emblem -->
  <g transform="translate(15, 10)">
    <circle cx="70" cy="70" r="66" fill="#1162AE" stroke="#FFCB04" stroke-width="3"/>
    <circle cx="70" cy="70" r="59" fill="none" stroke="#64B5F6" stroke-width="1.5" stroke-dasharray="4 3"/>
    
    <!-- Stylized "B" Monogram Intertwined with Cattle Horns -->
    <path d="M48 34 L78 34 C88 34, 94 40, 94 48 C94 54, 90 59, 83 62 C92 65, 96 72, 96 82 C96 92, 88 98, 76 98 L48 98 Z" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    <line x1="62" y1="36" x2="62" y2="96" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M62 64 L78 64" stroke="#FFFFFF" stroke-width="5"/>
    
    <!-- Gold Crown / Horns on top of B -->
    <path d="M42 32 C38 20, 48 14, 58 10 C54 18, 54 26, 52 32 Z" fill="url(#fazendaBGold)"/>
    <path d="M98 32 C102 20, 92 14, 82 10 C86 18, 86 26, 88 32 Z" fill="url(#fazendaBGold)"/>
    <polygon points="70,16 75,26 65,26" fill="#FFCB04"/>
  </g>

  <!-- Typography: FAZENDA B -->
  <g transform="translate(170, 45)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#1976D2" text-transform="uppercase">
      AGROPECUÁRIA
    </text>
    <text x="0" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" letter-spacing="2" fill="#1162AE">
      FAZENDA B
    </text>
    <line x1="0" y1="58" x2="280" y2="58" stroke="#FFCB04" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#64748B" text-transform="uppercase">
      REBANHO COMERCIAL &amp; REPRODUÇÃO
    </text>
  </g>
</svg>
