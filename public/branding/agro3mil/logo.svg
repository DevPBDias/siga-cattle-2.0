<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="agroGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCB04"/>
      <stop offset="100%" stop-color="#E5A800"/>
    </linearGradient>
    <linearGradient id="agroGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D7D46"/>
      <stop offset="100%" stop-color="#1E3B2B"/>
    </linearGradient>
  </defs>

  <!-- Circular Emblem with Bull / Horn Silhouette -->
  <g transform="translate(15, 10)">
    <circle cx="70" cy="70" r="66" fill="#1E3B2B" stroke="#FFCB04" stroke-width="3"/>
    <circle cx="70" cy="70" r="59" fill="none" stroke="#2D7D46" stroke-width="1.5" stroke-dasharray="4 3"/>
    
    <!-- Stylized Bull Silhouette in Gold -->
    <path d="M42 66 C40 50, 48 36, 56 30 C58 35, 62 42, 65 48 C67 43, 73 43, 75 48 C78 42, 82 35, 84 30 C92 36, 100 50, 98 66 C95 78, 86 86, 75 92 L75 106 L65 106 L65 92 C54 86, 45 78, 42 66 Z" fill="url(#agroGold)"/>
    
    <!-- Horn Accent -->
    <path d="M50 40 C44 32, 40 22, 36 12 C46 16, 56 24, 60 32 Z" fill="#FFCB04"/>
    <path d="M90 40 C96 32, 100 22, 104 12 C94 16, 84 24, 80 32 Z" fill="#FFCB04"/>
    
    <!-- Grain / Ear Motif at base -->
    <path d="M54 102 C62 108, 78 108, 86 102" stroke="#FFCB04" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Typography: FAZENDA AGRO 3MIL -->
  <g transform="translate(170, 45)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#2D7D46" text-transform="uppercase">
      FAZENDA
    </text>
    <text x="0" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="1" fill="#1E3B2B">
      AGRO 3MIL
    </text>
    <line x1="0" y1="58" x2="280" y2="58" stroke="#FFCB04" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#5A6B5D" text-transform="uppercase">
      PECUÁRIA • GENÉTICA • ALTA PERFORMANCE
    </text>
  </g>
</svg>
