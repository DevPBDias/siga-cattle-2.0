<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="harasLumaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A6040"/>
      <stop offset="100%" stop-color="#2C4A2E"/>
    </linearGradient>
    <linearGradient id="harasLumaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B060"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
  </defs>

  <!-- Circular Shield Emblem -->
  <g transform="translate(15, 10)">
    <circle cx="70" cy="70" r="66" fill="url(#harasLumaGreen)" stroke="#C9A84C" stroke-width="3"/>
    <circle cx="70" cy="70" r="59" fill="none" stroke="#C9A84C" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>

    <!-- Stylized "L" Monogram with horse shoe detail -->
    <path d="M48 38 L48 102 L94 102 L94 92 L60 92 L60 38 Z" fill="#FFFFFF" opacity="0.95"/>

    <!-- Gold accent bar at bottom -->
    <rect x="48" y="98" width="46" height="6" rx="2" fill="url(#harasLumaGold)"/>

    <!-- Decorative star/crown at top -->
    <polygon points="70,16 73,24 81,24 75,29 77,37 70,32 63,37 65,29 59,24 67,24" fill="url(#harasLumaGold)"/>
  </g>

  <!-- Typography: HARAS FAZENDA LUMA -->
  <g transform="translate(170, 40)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#3A6040">
      HARAS
    </text>
    <text x="0" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="1" fill="#2C4A2E">
      FAZENDA LUMA
    </text>
    <line x1="0" y1="60" x2="295" y2="60" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#64748B">
      HARAS &amp; EQUINOS DE ELITE
    </text>
  </g>
</svg>
